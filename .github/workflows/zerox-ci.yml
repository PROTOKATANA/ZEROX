# ZEROX CI — workspace nuevo, crates portados de `9681061` (W01)
#
# Cubre SOLO `zx-core` y `zx-pot`: formato, clippy estricto, build, tests (con sus vectores
# NIST CAVP y el oráculo Julia copiado a `testdata/`) y la regla de versiones exactas.
#
# NO cubre todavía: consenso, nodo ni red. Los jobs `alcance`, `almacen` y `frontera` del CI
# antiguo dependían de `zx-consensus`, `zx-storage`, `zx-p2p` y de scripts retirados; se
# reintroducirán cuando las órdenes posteriores porten esos crates.
name: ZEROX CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  deps:
    name: Dependencias — versiones pineadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Regla del proyecto: las dependencias van con versión EXACTA (`=`).
      # Un rango en workspace.dependencies deja que `cargo update` mueva consenso.
      - name: Rechazar rangos de versión en [workspace.dependencies]
        run: bash ci/dependencias-exactas.sh
