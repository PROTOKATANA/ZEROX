# ZEROX CI — workspace nuevo, crates portados de `9681061` (W01, W02, W04, W05a, W05b1)
#
# Cubre `zx-core`, `zx-pot`, `zx-consensus`, `zx-dag`, `zx-poas` y `zx-farmer`: formato, clippy
# estricto, build, tests (con sus vectores NIST CAVP, los oráculos Julia copiados a `testdata/`, el
# motor PoW dev, el orden DAG, el verificador PoAS, la historia génesis dev y el granjero), la regla
# de versiones exactas y las fronteras de dependencias de los crates de consenso.
#
# `zx-poas` y `zx-farmer` enlazan por `path` el clon fijado `PDF/autonomys-subspace` @ f8842d0, que
# no se versiona (`.gitignore`). Un runner que quiera construir estos dos crates debe materializar
# ese clon en su árbol antes del paso de build; el clon no se incluye en el workspace (ver
# `exclude` en `Cargo.toml`).
#
# `zx-node` (W06d1) integra los crates de consenso, PoT, PoAS/farmer, DAG, cadena y almacén en un
# solo proceso sin red; también enlaza por `path` el clon fijado, así que el paso de clon de abajo
# es imprescindible para que `zx-poas`, `zx-farmer`, `zx-post` y `zx-node` compilen en el runner.
#
# Los jobs `almacen` del CI antiguo dependían de scripts retirados; se reintroducirán cuando las
# órdenes posteriores porten la red (`W06d2`). Los crates del workspace entran por `--workspace` sin
# pasos adicionales.
name: ZEROX CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-03
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # IPA E-03: clon fijado de Autonomys (tabla de `PDF/README.md`). Sin él, `zx-poas`,
      # `zx-farmer`, `zx-post` y `zx-node` no compilan (enlazan `PDF/autonomys-subspace` por `path`).
      - name: Clonar Autonomys (clon fijado, IPA E-03)
        run: |
          git clone https://github.com/autonomys/subspace PDF/autonomys-subspace
          git -C PDF/autonomys-subspace checkout --detach f8842d019cdf0f7163421b9644db5a9ff82b2a73
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo build --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  deps:
    name: Dependencias — versiones pineadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Regla del proyecto: las dependencias van con versión EXACTA (`=`).
      # Un rango en workspace.dependencies deja que `cargo update` mueva consenso.
      - name: Rechazar rangos de versión en [workspace.dependencies]
        run: bash ci/dependencias-exactas.sh
      - name: Fronteras de dependencias (zx-poas → {zx-core,zx-consensus}; zx-farmer → {zx-core,zx-poas})
        run: bash ci/frontera-crates.sh
      - name: Firmante obligatorio (zx-node no usa productores sin firmante)
        run: bash ci/firmante-obligatorio.sh
