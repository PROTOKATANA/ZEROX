[package]
name         = "zx-consensus"
description  = "Motor PoW de la fase de arranque: retarget LWMA-1, selección por trabajo, timestamps, génesis dev y minero CPU, parametrizados por red"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
thiserror       = { workspace = true }
primitive-types = { workspace = true }
zx-core         = { path = "../zx-core" }

# Test: `proptest` ya lo usa el workspace (`zx-core`) y sus versiones ya están resueltas en
# `Cargo.lock`. No se añade ninguna dependencia externa nueva.
[dev-dependencies]
proptest = { workspace = true }
