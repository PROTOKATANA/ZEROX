[package]
name         = "zx-storage"
description  = "RocksDB + flat files: bloques, cabeceras, UTXO set, árbol de commitments, nullifier set"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[features]
# RocksDB es una dependencia enorme (bindgen, libclang, minutos de compilación). Dejarla opcional
# mantiene rápido el ciclo de todo lo que no la necesita — que es casi todo, porque la lógica se
# prueba contra `AlmacenEnMemoria`.
default = []
rocksdb = ["dep:rocksdb"]

[dependencies]
thiserror    = { workspace = true }
zx-core      = { path = "../zx-core" }
zx-consensus = { path = "../zx-consensus" }
rocksdb      = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
