[package]
name         = "zx-p2p"
description  = "libp2p: transporte, descubrimiento, gossip, sync headers-first"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
zx-core      = { path = "../zx-core" }
libp2p       = { workspace = true, features = [
    "tokio", "tcp", "quic", "noise", "yamux", "dns",
    "identify", "ping", "kad", "mdns", "gossipsub", "request-response",
    "macros", "ed25519",
] }
tokio        = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }

[dev-dependencies]
# SOLO en dev: los tests comprueban que los límites de transporte son coherentes con las
# constantes de consenso, pero el CÓDIGO de este crate no puede llamar a consenso ni por accidente.
# Ver el diagrama de dependencias en `lib.rs`.
zx-consensus   = { path = "../zx-consensus" }
proptest       = { workspace = true }
futures_ringbuf = { workspace = true }
