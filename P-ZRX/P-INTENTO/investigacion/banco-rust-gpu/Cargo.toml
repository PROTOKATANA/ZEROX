# Sonda GPU de P-INTENTO (M5). Crate aparte para que el banco CPU no arrastre wgpu/spirv.
#
# Presupuesto del encargo: 1 hora de intento. Si no compila o no encuentra dispositivo, el
# resultado es «GPU no medida»; nunca se sustituye por el «<5 s» de la documentacion.
[workspace]

[package]
name = "intento-gpu"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
subspace-proof-of-space-wgpu = { path = "../../../../../fuentes/subspace/shared/subspace-proof-of-space-wgpu" }
subspace-core-primitives = { path = "../../../../../fuentes/subspace/crates/subspace-core-primitives" }
subspace-erasure-coding = { path = "../../../../../fuentes/subspace/crates/subspace-erasure-coding" }
subspace-kzg = { path = "../../../../../fuentes/subspace/shared/subspace-kzg" }
futures = "0.3"
blake3 = "1.8.5"
