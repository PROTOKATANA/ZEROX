# Entorno mínimo de RNG-v0.1. Del catálogo de la plantilla (`veritas/plantilla/Project.toml`) se
# conservan SOLO las dependencias realmente usadas (LINEO §5): `BenchmarkTools` (bench),
# `StableRNGs` (muestra aleatoria reproducible) y `JET` (análisis estático del kernel). `Test` y
# `Random` son stdlib y entran por `[extras]`/`[targets]`.
[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
JET = "c3a54625-cd67-489e-a8e7-0a5a0ff4e31b"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"

[compat]
BenchmarkTools = "1.8"
JET = "0.12"
StableRNGs = "1"
julia = "1.13"

[extras]
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Test", "Random"]
