# Crate propio del instrumento `espacio-tasa-v1`. El repositorio ZEROX tiene su workspace en la
# raiz; un `[workspace]` vacio declara este crate raiz de su propio workspace para no obligar a
# tocar `ZEROX/Cargo.toml` (el encargo prohibe modificar ficheros ajenos al instrumento).
[workspace]

[package]
name = "oraculo-espacio-tasa"
version = "0.1.0"
edition = "2021"
publish = false
description = "Oraculo Rust: logica PoAS fijada de Autonomys @ f8842d0 aplicada al puente espacio -> tasa"

# Dependencias POR RUTA al clon fijado `/home/katana/zeo/fuentes/subspace` @ f8842d0.
# Solo se llama a su API PUBLICA; no se copia ni se modifica una linea de Autonomys.
# Los `[patch]` del workspace de Autonomys (polkadot-sdk, libp2p-identity) no afectan a este
# subconjunto de dependencias, asi que no se replican.
[dependencies]
ab-proof-of-space = { path = "../../../../../../../fuentes/subspace/shared/ab-proof-of-space", features = [
    "alloc",
    "parallel",
    "full-chiapos",
] }
subspace-core-primitives = { path = "../../../../../../../fuentes/subspace/crates/subspace-core-primitives" }
subspace-erasure-coding = { path = "../../../../../../../fuentes/subspace/crates/subspace-erasure-coding" }
subspace-proof-of-space = { path = "../../../../../../../fuentes/subspace/crates/subspace-proof-of-space", features = [
    "alloc",
    "parallel",
] }
subspace-verification = { path = "../../../../../../../fuentes/subspace/crates/subspace-verification" }
subspace-kzg = { path = "../../../../../../../fuentes/subspace/shared/subspace-kzg" }
subspace-farmer-components = { path = "../../../../../../../fuentes/subspace/crates/subspace-farmer-components" }
blake3 = "1.8.5"
hex = "0.4"
rayon = "1.12"

[profile.release]
# Identico al perfil `bench`/`release` del clon: sin LTO, `panic = unwind`.
# Sin `-ffast-math` ni `target-cpu=native`: LINEO §5.7 los prohibe por defecto.
opt-level = 3
lto = false
debug = false

[[bin]]
name = "puente"
path = "src/bin/puente.rs"
