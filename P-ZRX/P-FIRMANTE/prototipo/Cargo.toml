# Prototipo P-FIRMANTE — el firmante seguro.
#
# NO forma parte del workspace de ZEROX: `crates/` es de solo lectura para este encargo, y meter
# un miembro nuevo exigiría editar `Cargo.toml` en la raíz. En vez de eso este crate declara su
# propio `[workspace]` vacío (lo aísla del workspace superior, que si no lo reclamaría) y depende
# por RUTA de `zx-core`. El resultado es un crate propio, con su propio `Cargo.lock`, que usa los
# tipos y la criptografía del repositorio sin duplicarlos.
#
# Versiones: las MISMAS que el `Cargo.lock` de la raíz (zx-core 0.0.0 con su lock, libc 0.2.189,
# tempfile 3.24.0, ed25519-zebra 4.2.0). No se fija ninguna versión nueva y el árbol transitivo de
# zx-core lo manda su propio lock; el de aquí se generó con `cargo generate-lockfile --offline` y a
# partir de ahí todo se compila con `--locked`.
[package]
name = "firmante-seguro"
version = "0.0.0"
edition = "2024"
publish = false
description = "Prototipo del firmante seguro: registro durable de oportunidades antes de emitir el sello (P-FIRMANTE)"

[workspace]

[dependencies]
zx-core = { path = "../../../crates/zx-core" }
# La firma Ed25519 del sello. Es la MISMA del repositorio y la misma versión pineada: `zx-core`
# verifica con `ed25519-zebra` (ZIP-215) y aquí se firma con `ed25519-zebra`. No se introduce
# ningún otro firmador.
ed25519-zebra = "=4.2.0"
# `flock(2)` para la exclusión entre PROCESOS sobre el mismo fichero de registro. El `fsync` se
# llama por `std::fs::File::sync_all`; solo el bloqueo necesita FFI.
libc = "=0.2.189"
# Mismo `thiserror` pineado que el workspace, para los errores del registro.
thiserror = "=2.0.20"

[dev-dependencies]
tempfile = "=3.24.0"

[lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
wildcard_imports = "deny"
panic            = "deny"
todo             = "warn"
indexing_slicing = "warn"
integer_division = "warn"

[lints.rust]
unsafe_code     = "warn"
missing_docs    = "warn"
unused_must_use = "deny"
