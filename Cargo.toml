[workspace]
resolver = "3"
members = [
    "crates/zx-core",
    "crates/zx-pot",
    "crates/zx-consensus",
    "crates/zx-dag",
    "crates/zx-poas",
    "crates/zx-farmer",
    "crates/zx-post",
    "crates/zx-p2p",
    "crates/zx-cadena",
    "crates/zx-storage",
    "crates/zx-node",
]
# El clon fijado `PDF/autonomys-subspace` vive dentro de la copia de trabajo, así que Cargo lo
# incluiría como miembro automático de este workspace al enlazarlo por `path` y resolvería su
# herencia `workspace = true` contra ESTE manifiesto, que no tiene sus cientos de
# `[workspace.dependencies]`. Se excluyen los nueve paquetes enlazados (los mismos de `9681061`)
# para que cada paquete resuelva su herencia `workspace = true` contra el workspace del clon,
# como ya hacían los instrumentos de `9681061`. No se toca el clon. `subspace-data-retrieval`
# vive en `shared/`, no en `crates/`.
exclude = [
    "PDF/autonomys-subspace/crates/subspace-core-primitives",
    "PDF/autonomys-subspace/crates/subspace-proof-of-space",
    "PDF/autonomys-subspace/crates/subspace-verification",
    "PDF/autonomys-subspace/shared/subspace-kzg",
    "PDF/autonomys-subspace/shared/ab-proof-of-space",
    "PDF/autonomys-subspace/crates/subspace-farmer-components",
    "PDF/autonomys-subspace/crates/subspace-archiving",
    "PDF/autonomys-subspace/shared/subspace-data-retrieval",
    "PDF/autonomys-subspace/crates/subspace-erasure-coding",
]

[workspace.package]
version    = "0.0.0"
edition    = "2024"
rust-version = "1.90"
license    = "AGPL-3.0-or-later"
repository = "https://github.com/PROTOKATANA/ZEROX"

# ─────────────────────────────────────────────────────────────────────────
# Versiones EXACTAS (`=`), no rangos. Regla del proyecto: adoptar cripto
# auditada sin tocarla, y que un `cargo update` no pueda mover consenso.
# Versiones consultadas en crates.io el 2026-09-04.
# ─────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# --- cripto / consenso — pineado duro, no tocar sin revisión humana ---
# NOTA (auditoría 2026-09-04, zx-implementaciones): pinear `sha3 = "=x"` NO pinea la
# permutación — `sha3` delega en `keccak` y `sponge-cursor` como RANGOS. Por eso el
# Cargo.lock se committea (fuera de .gitignore) y la CI corre con `--locked`: el lock es
# la única fuente de verdad del árbol transitivo consensus-critical. Ver research/sha3-referencias.md.
ed25519-zebra         = "=4.2.0"
sha3                  = "=0.12.0"
bech32                = "=0.12.0"
primitive-types       = "=0.14.0"

# --- PoT AES (SPEC §7.1.1, C-POT-02) ---
# `zx-pot` porta `subspace-proof-of-time` @ f8842d0. AES y BLAKE3 no se eligen aquí: son las
# versiones que el prototipo resolvió y que validan sus 32 vectores diferenciales. En particular
# NO se sustituye AES por el 0.8.4 que ya está en el lock (rama de `aes-gcm`) para facilitar la
# compilación: eso cambiaría la primitiva. `cpufeatures 0.2` es el que usa la detección de CPU del
# port; `aes`/`blake3` traen su propio `cpufeatures 0.3`.
aes         = "=0.9.3"
blake3      = { version = "=1.8.7", default-features = false }
cpufeatures = "=0.2.17"

# --- errores, logging, CLI ---
thiserror          = "=2.0.20"
hex                = "=0.4.3"

# --- nodo (W06d1/W06d2) — versión exacta del `Cargo.lock` de `9681061` ---
# `clap` para la CLI del binario `zx-node` (directorio de datos, red, claves, papel, `N_dev`,
# `SR_dev`, registro, parada tras N slots). No se añade `serde` ni `tracing-subscriber`: no son
# imprescindibles (el registro estructurado se escribe a mano con el esquema fijo de
# `ESCENARIOS-0.0.1.md` §1). `tokio` **sí** se añade desde `ORDEN-W06d2`: `zx-node` pasa a
# depender de `zx-p2p` para hablar la red real; reutiliza la misma instancia de `tokio` que ya
# fijó `zx-p2p` más abajo (nunca dos runtimes async con versiones distintas en el mismo binario).
clap               = { version = "=4.6.6", features = ["derive"] }

# --- farmer (D1/D2) — versiones exactas del `Cargo.lock` de `9681061` ---
# `rand`/`rand_chacha`: relleno propio de la historia génesis dev (D-P12), no el de Autonomys.
# `futures`/`async-lock`/`parity-scale-codec`: las que usaba `zx-node` en `9681061`.
rand               = "=0.9.5"
rand_chacha        = "=0.9.0"
futures            = "=0.3.34"
async-lock         = "=3.4.2"
parity-scale-codec = { version = "=3.7.5", default-features = false, features = ["derive"] }

# --- almacén (W06b) — versiones exactas del `Cargo.lock` de `9681061` ---
# `rocksdb` 0.25 con sus features por defecto (snappy, lz4, zstd, zlib, bzip2) y `tempfile` para
# los tests del almacén en disco.
rocksdb  = "=0.25.0"
tempfile = "=3.24.0"

# --- test ---
proptest        = "=1.11.0"

# --- red P2P (libp2p) — versiones exactas del `Cargo.lock` de `9681061` ---
# `libp2p` 0.56 con transporte tokio, request-response y gossipsub; `tokio` como runtime;
# `async-trait` porque el trait `Codec` de request-response lo exige; `tracing` para los logs del
# bucle. `futures_ringbuf` solo en dev: par AsyncRead/AsyncWrite en memoria para testear el códec
# sin levantar un `Swarm` (el patrón de `request-response/src/cbor.rs`).
libp2p          = "=0.56.0"
tokio           = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait     = "=0.1.92"
tracing         = "=0.1.44"
futures_ringbuf = "=0.4.0"

# ─────────────────────────────────────────────────────────────────────────
# Lints: en código de consenso un panic es un vector de DoS.
# ─────────────────────────────────────────────────────────────────────────
[workspace.lints.clippy]
unwrap_used      = "deny"
expect_used      = "deny"
wildcard_imports = "deny"
panic            = "deny"
todo             = "warn"
indexing_slicing = "warn"
integer_division = "warn"

[workspace.lints.rust]
unsafe_code       = "warn"
missing_docs      = "warn"
unused_must_use   = "deny"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
